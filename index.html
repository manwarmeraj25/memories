<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Memories</title>
<meta name="description" content="A personal photo archive, threaded year by year — newest first.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#1C1930" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#E7E5F4" media="(prefers-color-scheme: light)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='11' fill='%231C1930'/%3E%3Crect x='5' y='14.2' width='22' height='4' rx='2' fill='%23282443'/%3E%3Crect x='5' y='14.2' width='22' height='2' rx='1' fill='%23FFFFFF' fill-opacity='.13'/%3E%3Ccircle cx='16' cy='16' r='6.4' fill='%23E2BE5A'/%3E%3Cellipse cx='15.2' cy='13.6' rx='4' ry='2.4' fill='%23FFFFFF' fill-opacity='.34'/%3E%3C/svg%3E">

<link rel="preload" as="font" type="font/woff2" href="assets/fonts/karla-normal-300_700-latin.woff2" crossorigin>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

<a class="u-sr" href="#plane">Skip to the archive</a>

<nav class="anchors" id="anchors" aria-label="Jump to a year"></nav>

<header class="hero" id="hero"></header>

<main class="plane" id="plane"></main>

<footer class="tail">
  <p class="tail__how">Drop photographs into <code>assets/images/&lt;year&gt;/</code>.
    A new year folder threads itself on.</p>
</footer>

<div class="slip" id="slip" role="status" aria-live="polite" hidden></div>

<div class="open" id="open" role="dialog" aria-modal="true" aria-labelledby="open-title" hidden>
  <div class="open__stage">
    <img id="open-img" alt="" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg'/%3E">
  </div>
  <div class="open__rail">
    <span class="d" id="open-where">—</span>
    <h2 class="open__title" id="open-title"></h2>
    <span class="d" id="open-date"></span>
  </div>
  <button class="key open__close" id="open-close" type="button" aria-label="Close">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 7 7 17M7 7l10 10"/></svg>
  </button>
  <button class="key open__step open__step--prev" id="open-prev" type="button" aria-label="Previous photograph">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6 8.5 12l6 6"/></svg>
  </button>
  <button class="key open__step open__step--next" id="open-next" type="button" aria-label="Next photograph">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 6l6 6-6 6"/></svg>
  </button>
</div>

<script src="data/memories.js"></script>
<script src="assets/js/vendor/motion.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
